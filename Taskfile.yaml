version: "3"

silent: true

tasks:
  default:
    desc: List available tasks
    cmd: task -g --list-all

  backup:home:
    desc: Backup secure content from $HOME
    summary: >-
      Tars the secure parts of $HOME — .aws, .config, .ssh, .gnupg, .keys, .extra, the git
      configs, the Claude settings and skills — and attaches the archive to the 'Personal Home
      Directory' item in the 1Password Backups vault, then deletes the local copy. Caches and live
      sockets are excluded, so the archive holds configuration and keys rather than state. Needs
      the backup service account's token, which the script reads from 1Password itself.
    cmd: secure_home_backup.sh

  claude:snapshot:
    desc: Refresh the Claude Code skills + plugins snapshot in dotfiles
    summary: >-
      Copies ~/.agents/.skill-lock.json into claude/, and extracts just enabledPlugins and
      extraKnownMarketplaces from ~/.claude/settings.json into claude/settings.snippet.json — the
      rest of that file is machine-local and deliberately not captured. It stages nothing and
      commits nothing; it prints git status for the two files so you can see what moved.
    vars:
      DOTFILES_CLAUDE: "$HOME/code/github.com/robinbowes/dotfiles/claude"
    cmds:
      - cp "$HOME/.agents/.skill-lock.json" "{{.DOTFILES_CLAUDE}}/skill-lock.json"
      - |
        tmp=$(mktemp) && \
        jq '{enabledPlugins, extraKnownMarketplaces}' "$HOME/.claude/settings.json" > "$tmp" && \
        mv "$tmp" "{{.DOTFILES_CLAUDE}}/settings.snippet.json"
      - git -C "{{.DOTFILES_CLAUDE}}" status -s -- skill-lock.json settings.snippet.json

  vim:plugins:check:
    desc: List vim plugins with upstream updates available
    summary: >-
      Read-only counterpart to vim:plugins:update: fetches each .gitmodules submodule and reports
      the ones whose upstream default branch has moved ahead. It changes no submodule and stages
      nothing.
    vars:
      DOTFILES: "$HOME/code/github.com/robinbowes/dotfiles"
    cmds:
      - |
        cd "{{.DOTFILES}}"
        git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
          | awk '{print $2}' | while IFS= read -r p; do
          git -C "$p" fetch --quiet origin 2> /dev/null || continue
          git -C "$p" remote set-head origin -a > /dev/null 2>&1 || true
          ref=$(git -C "$p" symbolic-ref --short refs/remotes/origin/HEAD 2> /dev/null) || continue
          cur=$(git -C "$p" rev-parse --short HEAD)
          tgt=$(git -C "$p" rev-parse --short "$ref")
          if [ "$cur" != "$tgt" ]; then
            n=$(git -C "$p" rev-list --count "HEAD..$ref")
            printf '  %-30s %s -> %s  (%s behind %s)\n' "$(basename "$p")" "$cur" "$tgt" "$n" "$ref"
          fi
        done
        echo "  (nothing listed means every plugin is current)"

  vim:plugins:update:
    desc: Update vim plugins to their upstream default branch
    summary: >-
      Fast-forwards each vim plugin submodule to its upstream default branch, resolving that
      branch per submodule rather than assuming main. A submodule whose fetch fails is reported as
      SKIP and left alone, so a network blip cannot half-update the set. Commit the submodule
      pointers yourself afterwards.
    vars:
      DOTFILES: "$HOME/code/github.com/robinbowes/dotfiles"
    cmds:
      - |
        cd "{{.DOTFILES}}"
        git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
          | awk '{print $2}' | while IFS= read -r p; do
          if ! git -C "$p" fetch --quiet origin 2> /dev/null; then
            printf '  SKIP (fetch failed): %s\n' "$p"
            continue
          fi
          git -C "$p" remote set-head origin -a > /dev/null 2>&1 || true
          ref=$(git -C "$p" symbolic-ref --short refs/remotes/origin/HEAD 2> /dev/null) || continue
          cur=$(git -C "$p" rev-parse --short HEAD)
          git -C "$p" checkout --quiet "$ref"
          new=$(git -C "$p" rev-parse --short HEAD)
          if [ "$cur" != "$new" ]; then
            printf '  updated: %-28s %s -> %s\n' "$(basename "$p")" "$cur" "$new"
          fi
        done
      - git -C "{{.DOTFILES}}" status --short
      - echo "Review, then commit the submodule pointers on a branch."

  dotfiles:pull:
    desc: Pull local $HOME changes back into the dotfiles repo (inverse of bootstrap.sh)
    summary: >-
      Copies changed files from $HOME back into the repo, the inverse of bootstrap.sh. It walks
      the REPO's file list, so it only ever updates files already tracked — a new file in $HOME is
      invisible to it and has to be added by hand. claude/ is skipped (use claude:snapshot), as
      are the repo-only files: README.md, bootstrap.sh and the two LICENSE files. Prints each file
      it updated, then git status; it commits nothing.
    vars:
      DOTFILES: "$HOME/code/github.com/robinbowes/dotfiles"
    cmds:
      - |
        cd "{{.DOTFILES}}"
        find . \
          -path ./.git -prune -o \
          -path ./claude -prune -o \
          -type f \
          ! -name 'LICENSE-MIT.txt' \
          ! -name 'LICENSE-GPL.txt' \
          ! -name 'README.md' \
          ! -name 'bootstrap.sh' \
          -print | while IFS= read -r file; do
          rel="${file#./}"
          if [ -f "$HOME/$rel" ] && ! diff -q "$HOME/$rel" "$rel" >/dev/null 2>&1; then
            printf '  updated: %s\n' "$rel"
            cp "$HOME/$rel" "$rel"
          fi
        done
      - git -C "{{.DOTFILES}}" status -s
